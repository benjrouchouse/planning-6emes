    <style>
        :root {
            --bg: #f8fafc; --accent: #0284c7; --success: #16a34a;
            --card-bg: #ffffff; --text: #1e293b; --warning: #d97706;
            --vacation: #9333ea; --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0; background: var(--bg); color: var(--text);
            transition: 0.3s; padding-bottom: 40px; -webkit-user-select: none;
        }

        .header-logo { text-align: center; margin-top: 10px; font-size: 4rem; }

        .nav-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; padding: 15px; max-width: 500px; margin: 0 auto;
        }
        .nav-btn {
            background: var(--card-bg); border-radius: 20px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; aspect-ratio: 1 / 1;
            font-weight: bold; border: 1px solid var(--border); transition: 0.1s;
        }
        .nav-btn:active { transform: scale(0.95); background: var(--accent); color: white; }
        .nav-btn span.emoji { font-size: 2.5rem; margin-bottom: 10px; }

        .view { display: none; padding: 15px; animation: fadeIn 0.2s; }
        .view.active { display: block; }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        .back-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 10px 20px; border-radius: 10px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }

        #today-btn { 
            width: 100%; background: var(--card-bg); border: 2px solid var(--accent); 
            border-radius: 12px; padding: 15px; cursor: pointer; font-weight: bold; color: var(--accent);
            margin-bottom: 15px; font-size: 1rem;
        }

        .jump-row { display:flex; gap:10px; margin-bottom:15px; }
        #date-picker { flex:1; padding:12px; border-radius:12px; border:1px solid var(--border); font-size:16px; background:white; color:var(--text); }
        #jump-btn { background: var(--accent); color:white; border:none; padding:12px 18px; border-radius:12px; font-weight:bold; cursor:pointer; }
        #jump-btn:active { opacity:0.8; }

        .day-card { border-radius: 12px; background: white; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
        .day-card.work-day { border-left: 6px solid var(--accent); }
        .day-card.weekend { border-left: 6px solid #475569; }
        .day-card.vacation { background: #f3e8ff; border-left: 6px solid var(--vacation); }
        .day-card.today { border: 2px solid var(--accent); transform: scale(1.01); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .card-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .details { max-height: 0; overflow: hidden; transition: 0.3s; background: #f8fafc; }
        .day-card.active .details { max-height: 200px; padding: 15px; border-top: 1px solid var(--border); }

        .cl-item { background: white; border: 1px solid var(--border); padding: 15px; margin-bottom: 8px; border-radius: 12px; display: flex; align-items: center; transition: 0.2s; cursor: pointer; }
        .cl-item.done { opacity: 0.6; background: #f1f5f9; text-decoration: line-through; }
        .btn-wa { background: #25d366; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; }
        
        .prog-container { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .bar-bg { width: 100%; height: 12px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .bar-fill { height: 100%; width: 0%; background: var(--accent); transition: 0.4s ease-out; }

        textarea { width: 100%; box-sizing: border-box; font-size: 16px; border: 1px solid var(--border); height: 250px; background: white; color: var(--text); border-radius: 12px; padding: 15px; }
    </style>
</head>
<body>

    <div style="padding: 15px 20px;">
        <h2 style="margin:0; color:var(--accent);">SMS SMT 2026</h2>
    </div>

    <div class="header-logo">🚒</div>

    <div id="menu-view" class="view active">
        <div class="nav-grid">
            <div class="nav-btn" onclick="switchView('planning')"><span class="emoji">📅</span>Planning</div>

    </div>

    <div id="proc-view" class="view">

            <h3 style="color:var(--accent); margin-top:0;">⛽ Carburant Jeudi</h3>
            Saisie <b>Kimoce</b> avant 12h.<br>
            Scan BL à : <i style="color:var(--accent)">gp_piecesengins@intrabat.bmpm.fr</i>

<script>
    const cycleNames = ["6 & 4", "1 & 5", "2 & 6", "3 & 1", "4 & 2", "5 & 3"];
    const refDate = new Date(2026, 6, 14); 
    const vacancesB = [{s:"2026-02-14",e:"2026-03-01"},{s:"2026-04-11",e:"2026-04-26"},{s:"2026-07-04",e:"2026-08-31"},{s:"2026-10-17",e:"2026-11-01"},{s:"2026-12-19",e:"2026-12-31"}];
    
    const smsTasks = [

    function getCycleForDate(d) {
        const diffTime = d.getTime() - refDate.getTime();
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        let index = diffDays % 6;
        if (index < 0) index += 6;
        return cycleNames[index];
    }

    function getTasks(d) {
        const day = d.getDay();
        if(day===1) return "Matin: Code d'honneur, EPI, ARI. AM: Sport.";
        if(day===2) return "Matin: Échelles, Lot Tramway. AM: Renfo.";
        if(day===3) return "Matin: Thermiques. AM: Mise en pompe.";

        if(day===5) return "Matin: Pneumatiques. AM: Services.";
        if(day===6) return "Manœuvre SR. AM: Containers.";
        return "Protocole VSAV, Commande O2, Inventaire CCF.";
    }

    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id + '-view').classList.add('active');
        window.scrollTo(0,0);
        if(id === 'sms') renderSMS();
        if(id === 'planning') setTimeout(scrollToToday, 150);
    }

    function init() {
        const cal = document.getElementById('calendar-container');
        cal.innerHTML = '';
        const today = new Date();
        today.setHours(0,0,0,0);
        
        let d = new Date(2026, 0, 1);
        while(d.getFullYear() === 2026) {
            const dateId = `date-${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
            const isVac = vacancesB.some(v => {
                const start = new Date(v.s); const end = new Date(v.e);
                return d >= start && d <= end;
            });
            const isToday = d.getTime() === today.getTime();
            const cycleText = getCycleForDate(d);
            
            const card = document.createElement('div');
            card.id = dateId;
            card.className = `day-card ${isVac?'vacation':(d.getDay()==0||d.getDay()==6?'weekend':'work-day')} ${isToday?'today':''}`;
            card.innerHTML = `
                <div class="card-header" onclick="this.parentElement.classList.toggle('active')">
                    <span>${d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})} ${isVac?'🏖️':''}</span>
                    <span style="background:#f1f5f9;padding:4px 8px;border-radius:8px;">${cycleText}</span>
                </div>
                <div class="details">${getTasks(d)}</div>
            `;
            cal.appendChild(card);
            if(isToday) document.getElementById('info-relance').innerText = `Aujourd'hui : ${cycleText}`;
            d.setDate(d.getDate()+1);
        }
        renderSMS();
        document.getElementById('memo').value = localStorage.getItem('smt_memo') || "";

        // Pré-remplit le sélecteur de date avec le jour actuel
        const y = today.getFullYear();
        const m = String(today.getMonth()+1).padStart(2,'0');
        const dd = String(today.getDate()).padStart(2,'0');
        document.getElementById('date-picker').value = `${y}-${m}-${dd}`;
    }

    function renderSMS() {
        const saved = JSON.parse(localStorage.getItem('smt_sms')) || {};
        let done = 0;
        document.getElementById('sms-list').innerHTML = smsTasks.map((t,i) => {
            if(saved[i]) done++;
            return `<div class="cl-item ${saved[i]?'done':''}" onclick="toggleSMS(${i})">
                <span style="margin-left:10px">${t}</span>
            </div>`;
        }).join('');
        const pc = Math.round((done / smsTasks.length) * 100);
        document.getElementById('sms-bar').style.width = pc + "%";
        document.getElementById('sms-percent').innerText = pc + "%";
    }

    function toggleSMS(i) {
        let saved = JSON.parse(localStorage.getItem('smt_sms')) || {};
        saved[i] = !saved[i];
        localStorage.setItem('smt_sms', JSON.stringify(saved));
        renderSMS();
    }

    function resetSMS() { if(confirm("Réinitialiser les tâches ?")) { localStorage.removeItem('smt_sms'); renderSMS(); } }

    function copyToClipboard() {
        const m = document.getElementById('memo');
        m.select();
        document.execCommand('copy');
        const t = document.getElementById('copy-toast');
        t.style.display='block'; setTimeout(()=>t.style.display='none', 2000);
    }

    function shareWA() {
        const text = document.getElementById('memo').value;
        copyToClipboard();
        window.location.href = "whatsapp://send?text=" + encodeURIComponent(text);
    }

    function highlightCard(el) {
        document.querySelectorAll('.day-card.active').forEach(c => { if(c !== el) c.classList.remove('active'); });
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('active');
    }

    function scrollToToday() {
        const d = new Date();
        const dateId = `date-${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        const el = document.getElementById(dateId);
        if(el) highlightCard(el);
    }

    function goToDate() {
        const val = document.getElementById('date-picker').value; // format yyyy-mm-dd
        if(!val) return;
        const [y, m, dayNum] = val.split('-').map(Number);
        const dateId = `date-${y}-${m}-${dayNum}`;
        const el = document.getElementById(dateId);
        if(el) {
            highlightCard(el);
        } else {
            alert("Cette date n'est pas dans le planning 2026.");
        }
    }

    window.onload = init;
</script>
</body>
</html>
